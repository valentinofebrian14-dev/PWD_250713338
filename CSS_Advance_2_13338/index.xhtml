<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Formulir Registrasi Workshop Teknologi</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="form-container">
        <h1>Registrasi Workshop Teknologi &amp; Coding</h1>
        <p class="subtitle">Amankan kursi Anda untuk mengikuti sesi pelatihan intensif pengembangan web modern bersama praktisi industri.</p>
        
        <form action="#" method="post">
            <fieldset>
                <legend>Data Peserta</legend>
                
                <div class="form-group">
                    <label for="nama_peserta">Nama Lengkap &amp; Gelar:</label>
                    <input type="text" id="nama_peserta" name="nama_peserta" placeholder="Nama lengkap peserta" required="required" />
                </div>
                
                <div class="form-group">
                    <label for="instansi">Asal Universitas / Instansi:</label>
                    <input type="text" id="instansi" name="instansi" placeholder="Contoh: Universitas Atma Jaya Yogyakarta" required="required" />
                </div>

                <div class="form-group">
                    <label for="whatsapp">Nomor WhatsApp / Seluler:</label>
                    <input type="text" id="whatsapp" name="whatsapp" placeholder="08xxxxxxxxxx" required="required" />
                </div>
            </fieldset>

            <fieldset>
                <legend>Pilihan Topik Sesi</legend>
                
                <div class="form-group">
                    <label for="topik">Pilih Kelas Workshop:</label>
                    <select id="topik" name="topik">
                        <option value="uiux">Mastering UI/UX Design with Figma</option>
                        <option value="frontend">Advanced Frontend Web Development</option>
                        <option value="backend">API &amp; Backend Architecture with Node.js</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sesi Waktu Kehadiran:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="sesi" value="pagi" /> Sesi 1: Pagi (09.00 - 12.00 WIB)</label>
                        <label><input type="checkbox" name="sesi" value="siang" /> Sesi 2: Siang (13.30 - 16.30 WIB)</label>
                    </div>
                </div>
            </fieldset>

            <div class="button-group">
                <input type="submit" value="Daftar Sekarang" class="btn-submit" />
                <input type="reset" value="Bersihkan Form" class="btn-reset" />
            </div>
        </form>
    </div>
</body>
</html>
