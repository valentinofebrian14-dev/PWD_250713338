<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Workshop</title>
</head>
<body>
    <h1>Formulir Pendaftaran Workshop</h1>
    <form action="" method="post" enctype="multipart/form-data">
        
        <!-- Tabel 1: Data Peserta -->
        <h3>Data Peserta</h3>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="nama_workshop"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="nama_workshop" name="nama_workshop" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nim_workshop"><strong>NIM</strong></label>
                </td>
                <td>
                    <input type="text" id="nim_workshop" name="nim_workshop" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="jk_laki" name="jk_workshop" value="Laki-laki" />
                    <label for="jk_laki">Laki-laki</label>
                    <input type="radio" id="jk_perempuan" name="jk_workshop" value="Perempuan" />
                    <label for="jk_perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi_workshop"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi_workshop" name="prodi_workshop">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 2: Pilihan Workshop -->
        <h3>Pilihan Workshop</h3>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Peserta</strong>
                </td>
                <td>
                    <input type="radio" id="mhs" name="jenis_peserta" value="Mahasiswa" />
                    <label for="mhs">Mahasiswa</label>
                    <input type="radio" id="umum" name="jenis_peserta" value="Umum" />
                    <label for="umum">Umum</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%; vertical-align: top;">
                    <strong>Materi Workshop</strong>
                </td>
                <td>
                    <input type="checkbox" id="uiux" name="materi" value="UI/UX Design" />
                    <label for="uiux">UI/UX Design</label><br />
                    <input type="checkbox" id="webdev" name="materi" value="Web Development" />
                    <label for="webdev">Web Development</label><br />
                    <input type="checkbox" id="dataanalysis" name="materi" value="Data Analysis" />
                    <label for="dataanalysis">Data Analysis</label>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 3: Informasi Tambahan -->
        <h3>Informasi Tambahan</h3>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%; vertical-align: top;">
                    <label for="alasan_workshop"><strong>Alasan Mengikuti Workshop</strong></label>
                </td>
                <td>
                    <textarea id="alasan_workshop" name="alasan_workshop" rows="6" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Pembayaran</strong>
                </td>
                <td>
                    <input type="radio" id="qris" name="pembayaran" value="QRIS" />
                    <label for="qris">QRIS</label>
                    <input type="radio" id="transfer" name="pembayaran" value="Transfer Bank" />
                    <label for="transfer">Transfer Bank</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar_workshop" value="Daftar" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
